<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskFlow</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5a6b7a;--ac:#0f766e;--acx:#fff;--bd:#d9e0e6;--p0:#c62828;--p1:#d84a00;--p2:#2e7d32;--p3:#1565c0;--neg:#c62828;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mut:#9fb0be;--ac:#2dd4bf;--acx:#06201d;--bd:#2b3946;--p0:#ff6b6b;--p1:#ffa040;--p2:#5fd068;--p3:#64b5f6;--neg:#ff7b7b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mut:#9fb0be;--ac:#2dd4bf;--acx:#06201d;--bd:#2b3946;--p0:#ff6b6b;--p1:#ffa040;--p2:#5fd068;--p3:#64b5f6;--neg:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 12px 110px}h1{font-size:20px;margin:6px 0 10px}h2{margin:0 0 10px;font-size:18px}h3{font-size:15px;margin:18px 0 6px}
button,select,input{font:inherit;color:inherit}button{min-height:44px;min-width:44px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.pri,.fab{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}.dng{color:var(--neg);border-color:var(--neg)}
input,select,textarea{min-height:44px;width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:0 10px}input[type=checkbox]{width:28px;min-height:28px;height:28px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}label input,label select,label textarea{margin-top:4px;color:var(--tx)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dn{display:flex;gap:8px;align-items:center;margin-bottom:8px}.dn input{flex:1;margin:0}.flt{display:flex;gap:8px;margin-bottom:10px}.flt select{flex:1}
.task,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}.task{border-left:8px solid var(--c)}
.p0{--c:var(--p0)}.p1{--c:var(--p1)}.p2{--c:var(--p2)}.p3{--c:var(--p3)}.task.done .tt{text-decoration:line-through;opacity:.6}
.row{display:flex;gap:10px;align-items:center}.ti{flex:1;min-width:0}.tt{font-weight:600;overflow-wrap:anywhere}.sm{font-size:13px;color:var(--mut)}.pl{color:var(--c);font-weight:700}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px;text-align:center}.times span{font-size:12px;color:var(--mut)}.times b{display:block;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums}
.neg{color:var(--neg)!important}.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--ac));width:0}.bar i.over{background:var(--neg)}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.ctl .sp{flex:1}.run{box-shadow:0 0 0 2px var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.br{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.br .bar{height:12px}.br em{text-align:right;font-style:normal;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;font-size:30px;box-shadow:0 4px 12px #0005}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;border-radius:0;background:none;min-height:60px;font-size:12px}nav button[aria-current=true]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(94vw,460px);padding:16px;max-height:92vh}dialog::backdrop{background:#0008}.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;z-index:9;display:none}.mut{color:var(--mut)}.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}[hidden]{display:none!important}@media(min-width:900px){main{max-width:760px}}textarea{padding:8px 10px!important;resize:vertical}
.task{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.task.drag{position:relative;z-index:5;box-shadow:0 10px 28px #000a;opacity:.95}.task.dt{outline:2px dashed var(--ac)}
.insp{display:flex;gap:10px;align-items:center;cursor:pointer}.insp img{width:56px;height:56px;object-fit:cover;border-radius:10px}.th{width:44px;height:44px;object-fit:cover;border-radius:8px}.chips button[aria-pressed=true]{background:var(--ac);color:var(--acx)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:4px 0 10px}.lg b{color:var(--c)}
</style></head><body><div id="toast" role="status" aria-live="polite"></div><main id="main"></main>
<nav aria-label="Main"><button data-a="tab" data-v="tasks">📋<br>Tasks</button><button data-a="tab" data-v="dash">📊<br>Dashboard</button><button data-a="tab" data-v="hist">📈<br>History</button><button data-a="tab" data-v="set">⚙️<br>Settings</button></nav><dialog id="dlg"></dialog><input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const DESK=window.desk||null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='taskflow.v1',PN=['Critical','High','Normal','Low'];
const D={tasks:[],series:[],cats:['Work','Study','Health','Personal'],subj:[],insp:[],wd:{},tpl:[],act:null,set:{wake:16,fmt:'hms',pri:2,cat:'Work',rem:true,alert:true,theme:'system',sort:'manual',inspMode:'daily',inspPin:''}};const VER='2.0';
let S=ld(),date=td(),tab='tasks',fp='all',fc='all',rng='7',rf='',rt='',edit=null,QI=null;
function ld(raw){let o={};try{o=JSON.parse(raw??(DESK?DESK.load():localStorage.getItem(K)))||{}}catch(e){}return{...structuredClone(D),...o,set:{...D.set,...(o.set||{})}}}
const CAP=window.Capacitor,NAT=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()),LN=NAT?CAP.Plugins.LocalNotifications:null;
const nid=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000};
function svq(){try{const j=JSON.stringify(S);DESK?DESK.save(j):localStorage.setItem(K,j)}catch(e){toast('Cannot save: storage blocked or full')}}
let _st;function sv(){svq();clearTimeout(_st);_st=setTimeout(()=>{sched();syncNative()},500)}
async function sched(){if(!LN)return;try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});const now=Date.now(),ns=[];
for(const t of S.tasks){if(t.done||!S.set.rem||!(t.rem||t.ts)||t.date<td())continue;const at=new Date(t.date+'T'+(t.rem||t.ts)+':00');if(at>now&&at-now<14*864e5)ns.push({id:nid('r'+t.id),title:'Reminder',body:t.title,schedule:{at,allowWhileIdle:true}})}
if(S.act&&S.set.alert){const t=gt(S.act.id);if(t&&t.target&&!t.al){const r=t.target*60-tk(t);if(r>0)ns.push({id:nid('a'+t.id),title:'Target reached',body:t.title,schedule:{at:new Date(now+r*1000),allowWhileIdle:true}})}}
if(ns.length)await LN.schedule({notifications:ns})}catch(e){}}
const NT=NAT?CAP.Plugins.TaskFlowNative:null;
function widgetData(dk){const L=ord(dayT(td())).filter(t=>!t.done).slice(0,6),q=curQuote();return{date:td(),top:L.map((t,i)=>({n:i+1,id:t.id,t:t.title,p:t.pri,tm:t.ts?t.ts+(t.te?'–'+t.te:''):'',tg:f(t.target*60),r:run(t)?1:0,b:run(t)?Math.round(Date.now()-tk(t)*1000):0,k:Math.round(tk(t))})),q:q&&q.text?q.text:'',qi:dk&&q&&q.img?q.img:''}}
function syncDesk(){try{const t=S.act&&gt(S.act.id);DESK.status(t?{title:t.title,base:Math.round(Date.now()-tk(t)*1000),target:t.target*60}:null);DESK.widget(widgetData(1))}catch(e){}}
function syncNative(){if(DESK)return syncDesk();if(!NT)return;try{if(S.act){const t=gt(S.act.id);t&&NT.showTimer({title:t.title,body:'Target '+f(t.target*60)+(t.te?' · until '+t.te:''),base:Math.round(Date.now()-tk(t)*1000)}).catch(()=>{})}else NT.hideTimer().catch(()=>{});NT.setWidget({json:JSON.stringify(widgetData())}).catch(()=>{})}catch(e){}}
const ui=(t,b)=>NAT?(toast(t+' — '+b),navigator.vibrate?.([200,100,200])):notify(t,b);
function pad(n){return String(n).padStart(2,'0')}function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function td(){return ds(new Date())}function addD(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function f(x){const n=x<0;x=Math.abs(Math.round(x));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return(n?'−':'')+(S.set.fmt=='hm'?(h?h+'h '+pad(m):m)+'m':h+':'+pad(m)+':'+pad(s))}
const gt=id=>S.tasks.find(t=>t.id==id),run=t=>S.act&&S.act.id==t.id,sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
function tk(t){let s=t.adj||0;for(const[a,b]of t.ss||[])s+=(b-a)/1000;if(run(t))s+=(Date.now()-S.act.start)/1000;return Math.max(0,s)}
const isStudy=c=>/^study$/i.test(c||'');
function mon(d){const w=(new Date(d+'T12:00').getDay()+6)%7;return addD(d,-w)}
const wake=d=>S.wd[d]??S.set.wake;
function ord(L){const m=S.set.sort,c=[...L],ci=x=>{const i=S.cats.indexOf(x);return i<0?999:i};if(m=='pri')c.sort((a,b)=>a.done-b.done||a.pri-b.pri);else if(m=='target')c.sort((a,b)=>a.done-b.done||b.target-a.target);else if(m=='cat')c.sort((a,b)=>ci(a.cat)-ci(b.cat));else if(m=='time')c.sort((a,b)=>(a.ts||'99:99').localeCompare(b.ts||'99:99'));return c}
function curQuote(){const L=S.insp;if(!L.length)return null;if(S.set.inspMode=='pin'){const p=L.find(x=>x.id==S.set.inspPin);if(p)return p}let k;if(S.set.inspMode=='random'){if(QI===null)QI=Math.floor(Math.random()*L.length);k=QI}else k=Math.floor(Date.now()/864e5);return L[k%L.length]}
function moveTo(id,tid){const a=S.tasks.find(t=>t.id==id),b=S.tasks.find(t=>t.id==tid);if(!a||!b||a==b)return;const down=S.tasks.indexOf(a)<S.tasks.indexOf(b);S.tasks.splice(S.tasks.indexOf(a),1);S.tasks.splice(S.tasks.indexOf(b)+(down?1:0),0,a);sv();render()}
function match(r,d,st){const w=new Date(d+'T12:00').getDay();return r=='daily'||(r=='weekdays'&&w>0&&w<6)||(r=='weekly'&&w==new Date(st+'T12:00').getDay())}
function dayT(d=date){if(d>=td())for(const s of S.series)if(d>=s.start&&match(s.rep,d,s.start)&&!(s.skip||[]).includes(d)&&!S.tasks.some(t=>t.sid==s.id&&t.date==d))S.tasks.push({id:uid(),sid:s.id,title:s.title,target:s.target,pri:s.pri,cat:s.cat,subj:s.subj||'',ts:s.ts||'',te:s.te||'',rem:s.rem,date:d,done:0,ss:[],adj:0,st:''});return S.tasks.filter(t=>t.date==d)}
/* timer: stored as absolute start timestamp => survives closing/reboot, never double counted */
function close(end){const t=gt(S.act.id);if(t)(t.ss=t.ss||[]).push([S.act.start,end||Date.now()]);S.act=null;return t}
function start(id){if(S.act)pause(S.act.id,1);S.act={id,start:Date.now(),seen:Date.now()};gt(id).st='run';sv();render()}
function pause(id,q){const t=close();if(t)t.st='paused';sv();q||render()}
function stop(id){const t=close();if(t)t.st='';sv();render()}
function cmv(i,d){const j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];sv();render()}
function mv(id,d){const L=dayT(),i=L.findIndex(t=>t.id==id),j=i+d;if(j<0||j>=L.length)return;const a=S.tasks.indexOf(L[i]),b=S.tasks.indexOf(L[j]);[S.tasks[a],S.tasks[b]]=[S.tasks[b],S.tasks[a]];sv();render()}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)}
function notify(t,b){toast(t+' — '+b);if(DESK){DESK.notify(t,b);return}if(LN){LN.schedule({notifications:[{id:Date.now()%2e9,title:t,body:b}]}).catch(()=>{});return}navigator.vibrate?.([200,100,200]);if('Notification'in window&&Notification.permission=='granted')navigator.serviceWorker?.getRegistration().then(r=>r?r.showNotification(t,{body:b,icon:'icon-192.png',tag:t+b}):new Notification(t,{body:b}))}
const hd=()=>`<div class="dn"><button data-a="dp" aria-label="Previous day">‹</button><input type="date" value="${date}" data-dp aria-label="Date"><button data-a="dnx" aria-label="Next day">›</button><button data-a="tdy">Today</button></div>`;
function inspCard(){const q=curQuote();return `<div class="card insp" data-a="insp" role="button" tabindex="0" aria-label="Inspiration. Tap to manage">${q?`${q.img?`<img src="${q.img}" alt="">`:''}<div>${q.text?`<i>“${esc(q.text)}”</i>`:''}${q.by?`<div class="sm">— ${esc(q.by)}</div>`:''}</div>`:'<span class="mut">✨ Tap to add a line of inspiration (text or photo)</span>'}</div>`}
function inspMgr(){modal(`<h2>Inspiration</h2><div style="max-height:32vh;overflow:auto">${S.insp.map(q=>`<div class="row" style="margin-bottom:8px">${q.img?`<img class="th" src="${q.img}" alt="">`:''}<div class="ti">${esc(q.text||'(photo)')}<div class="sm">${esc(q.by||'')}</div></div><button data-a="ipin" data-i="${q.id}" aria-label="Pin this" ${S.set.inspMode=='pin'&&S.set.inspPin==q.id?'class="pri"':''}>📌</button><button class="dng" data-a="idel" data-i="${q.id}" aria-label="Delete">✕</button></div>`).join('')||'<p class="mut">Nothing yet. Add your first line below.</p>'}</div>
<label>Your line<textarea id="it" rows="2" maxlength="200" placeholder="e.g. Small steps every day."></textarea></label><label>Author / note (optional)<input id="ib" maxlength="40"></label><label>Photo (optional – gallery or camera)<input type="file" id="ip" accept="image/*"></label>
<label>Show<select data-s="inspMode"><option value="daily" ${S.set.inspMode=='daily'?'selected':''}>A different one each day</option><option value="random" ${S.set.inspMode=='random'?'selected':''}>Random each time I open the app</option><option value="pin" ${S.set.inspMode=='pin'?'selected':''}>Only the pinned one 📌</option></select></label><div class="btns"><button data-a="cm">Close</button><button class="pri" data-a="iadd">Add</button></div>`)}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function vTasks(){const L=ord(dayT()),v=L.filter(t=>(fp=='all'||t.pri==fp)&&(fc=='all'||t.cat==fc));
return `<h1>Tasks</h1>`+inspCard()+hd()+`<div class="flt"><select data-s="sort" aria-label="Sort tasks">${[['manual','Sort: Manual order'],['pri','Sort: Priority (Critical first)'],['target','Sort: Longest target first'],['cat','Sort: Category order'],['time','Sort: Start time (schedule)']].map(([k,l])=>`<option value="${k}" ${S.set.sort==k?'selected':''}>${l}</option>`).join('')}</select></div>${S.set.sort=='manual'?'<div class="sm" style="margin:-4px 0 8px">Tip: hold a card, then drag it to reorder.</div>':''}<div class="flt"><select data-f="fp" aria-label="Filter by priority"><option value="all">All priorities</option>${PN.map((n,i)=>`<option value=${i} ${fp==i?'selected':''}>${n}</option>`).join('')}</select><select data-f="fc" aria-label="Filter by category"><option value="all">All categories</option>${S.cats.map(c=>`<option ${fc==c?'selected':''}>${esc(c)}</option>`).join('')}</select><button data-a="tools">Day tools</button></div>`+(v.length?v.map(t=>card(t,L.indexOf(t))).join(''):'<p class="mut">No tasks here. Tap + to add one.</p>')+`<button class="fab" data-a="add" aria-label="Add task">+</button>`}
function card(t,i){const r=run(t),p=t.st=='paused';return `<div data-id="${t.id}" class="task p${t.pri}${t.done?' done':''}${r?' run':''}"><div class="row"><input type="checkbox" data-a="done" data-i="${t.id}" ${t.done?'checked':''} aria-label="Complete: ${esc(t.title)}"><div class="ti"><div class="tt">${i+1}. ${esc(t.title)}</div><div class="sm"><span class="pl">${PN[t.pri]}</span> · ${esc(t.cat)}${t.subj?' › '+esc(t.subj):''}${t.sid?' · 🔁':''}${t.ts?' · 🕒 '+t.ts+(t.te?'–'+t.te:''):''}${t.rem?' · ⏰'+t.rem:''}${p?' · ⏸ paused':''}${r?' · ▶ running':''}</div></div><button data-a="edit" data-i="${t.id}" aria-label="Edit">✎</button></div>
<div class="times"><span>Target<b>${f(t.target*60)}</b></span><span>Taken<b data-k="tk" data-i="${t.id}"></b></span><span>Remaining<b data-k="rm" data-i="${t.id}"></b></span></div><div class="bar"><i data-k="bar" data-i="${t.id}"></i></div>
<div class="ctl">${S.set.sort=='manual'?`<button data-a="up" data-i="${t.id}" aria-label="Move up">▲</button><button data-a="dn" data-i="${t.id}" aria-label="Move down">▼</button>`:''}<span class="sp"></span>${r?`<button data-a="pause" data-i="${t.id}">⏸ Pause</button><button data-a="stop" data-i="${t.id}">⏹ Stop</button>`:`<button class="pri" data-a="start" data-i="${t.id}" ${t.done?'disabled':''}>${p?'▶ Resume':'▶ Start'}</button>${p?`<button data-a="stop" data-i="${t.id}">⏹ Stop</button>`:''}`}</div></div>`}
function upd(){$$('[data-k]').forEach(e=>{const t=gt(e.dataset.i);if(!t)return;const a=tk(t),g=t.target*60;if(e.dataset.k=='tk')e.textContent=f(a);else if(e.dataset.k=='rm'){e.textContent=f(g-a);e.classList.toggle('neg',g-a<0)}else{e.style.width=Math.min(100,g?a/g*100:0)+'%';e.classList.toggle('over',a>g)}})}
function bars(m,tot,cl){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);return e.length?e.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><div class="bar"><i style="width:${tot?v/tot*100:0}%;background:${cl&&cl[k]||'var(--ac)'}"></i></div><em>${f(v)}</em></div>`).join(''):'<p class="mut">No data.</p>'}
